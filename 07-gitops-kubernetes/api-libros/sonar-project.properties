sonar.organization=TU_ORGANIZACION
sonar.projectKey=TU_PROJECT_KEY

# Qué se analiza: el código en src/, sin los tests ni main.ts
sonar.sources=src
sonar.exclusions=src/**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.e2e-spec.ts
sonar.coverage.exclusions=src/main.ts

# El informe de cobertura que deja "npm run test:cov"
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true
