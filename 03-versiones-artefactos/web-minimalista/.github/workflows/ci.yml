# Pipeline de pull request (sesiones 01, 02 y 03)
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar necesita el historial completo

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: ¿Has subido la versión?
        if: github.event_name == 'pull_request'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" > /dev/null 2>&1; then
            echo "::warning::La versión $VERSION ya existe. Si tu PR cambia algo para los usuarios, súbela en package.json."
          fi

      - name: Build de la imagen Docker
        run: docker build -t web:ci .

      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

