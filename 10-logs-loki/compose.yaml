# Sesión 10: todo lo de las sesiones 08 y 09, más los logs con Loki.
# Aquí la API también corre en Docker, para que Alloy pueda leer sus logs.
#   docker compose up -d --build         (en esta carpeta)
# Para antes "npm run start:dev" si lo tenías: los dos usan el puerto 3000.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # para que también funcione en Linux

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    ports:
      - "3001:3000" # el 3000 es de la API
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin # solo para tu ordenador
      # Los correos de las alertas van a Mailpit, un servidor de correo falso
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@api-libros.local
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - mailpit

  # Recoge los correos que envía Grafana: http://localhost:8025
  # No sale nada de tu ordenador.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    ports:
      - "8025:8025"

  # La API de libros, construida con su Dockerfile
  api:
    build: ./api-libros
    container_name: api-libros
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development # /metrics abierto, como con npm run start:dev
      NO_COLOR: "1" # logs sin códigos de color

  # Guarda los logs
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    ports:
      - "3100:3100"

  # Lee los logs de los contenedores y se los envía a Loki
  alloy:
    image: grafana/alloy:v1.10.0
    container_name: alloy
    command: run /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # para leer los logs de los contenedores
    depends_on:
      - loki
