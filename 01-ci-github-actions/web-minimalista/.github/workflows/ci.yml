# Pipeline de pull request (sesión 01)
name: ci

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build de la imagen Docker
        run: docker build -t web:pr-${{ github.event.number }} .
